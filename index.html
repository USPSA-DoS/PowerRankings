<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USPSA Power Rankings Match Simulator</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --win: #10b981;
            --draw: #f59e0b;
            --loss: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .calc-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .calc-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .calc-header h2 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .calc-header p {
            margin: 6px 0 0 0;
            font-size: 0.875rem;
            opacity: 0.85;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 24px;
        }

        @media (min-width: 650px) {
            .calc-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #475569;
        }

        select, input[type="number"] {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--primary-light);
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .radio-btn {
            position: relative;
        }

        .radio-btn input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-btn label {
            display: block;
            text-align: center;
            padding: 10px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .radio-btn input:checked + label.lbl-win { background: var(--win); color: white; border-color: var(--win); }
        .radio-btn input:checked + label.lbl-draw { background: var(--draw); color: white; border-color: var(--draw); }
        .radio-btn input:checked + label.lbl-loss { background: var(--loss); color: white; border-color: var(--loss); }

        .output-section {
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .output-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            position: relative;
        }

        .output-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
        }

        .card-floor::before { background-color: #8b5cf6; }
        .card-filter::before { background-color: #3b82f6; }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
        }

        .card-desc {
            font-size: 0.8rem;
            color: #475569;
            margin-top: 4px;
            line-height: 1.3;
        }

        .math-note {
            font-family: monospace;
            background: #ede9fe;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #5b21b6;
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="calc-header">
        <h2>USPSA Match PR Simulator</h2>
        <p>Model v1.15 — Floor & Filter Analysis</p>
    </div>

    <div class="calc-grid">
        <!-- INPUTS -->
        <div class="input-section">
            <div class="form-group">
                <label for="myConf">Your Conference Tier</label>
                <select id="myConf" onchange="calculatePR()">
                    <option value="4">Premier (Level 4)</option>
                    <option value="3" selected>Champions (Level 3)</option>
                    <option value="2">Presidents (Level 2)</option>
                    <option value="1">Founders (Level 1)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="oppConf">Opponent Conference Tier</label>
                <select id="oppConf" onchange="calculatePR()">
                    <option value="4">Premier (Level 4)</option>
                    <option value="3">Champions (Level 3)</option>
                    <option value="2" selected>Presidents (Level 2)</option>
                    <option value="1">Founders (Level 1)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Match Outcome</label>
                <div class="radio-group">
                    <div class="radio-btn">
                        <input type="radio" id="resWin" name="outcome" value="win" checked onchange="calculatePR()">
                        <label for="resWin" class="lbl-win">Win</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="resDraw" name="outcome" value="draw" onchange="calculatePR()">
                        <label for="resDraw" class="lbl-draw">Draw</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="resLoss" name="outcome" value="loss" onchange="calculatePR()">
                        <label for="resLoss" class="lbl-loss">Loss</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label id="marginLabel" for="margin">Goal Margin</label>
                <input type="number" id="margin" min="1" max="20" value="1" oninput="calculatePR()">
            </div>
        </div>

        <!-- OUTPUTS -->
        <div class="output-section">
            <!-- FLOOR CARD -->
            <div class="output-card card-floor">
                <div class="card-title">The Floor (Match Value)</div>
                <div class="card-value" id="outValue">0.00</div>
                <div class="card-desc" id="outValueDesc">Calculating foundation...</div>
                <div class="math-note" id="outMathText">Math: -</div>
            </div>

            <!-- FILTER CARD -->
            <div class="output-card card-filter">
                <div class="card-title">The Filter (Match Weight)</div>
                <div class="card-value" id="outWeight">1.00</div>
                <div class="card-desc" id="outWeightDesc">Calculating significance...</div>
            </div>
        </div>
    </div>
</div>

<script>
function calculatePR() {
    // Get Input Values
    const myLevel = parseInt(document.getElementById('myConf').value);
    const oppLevel = parseInt(document.getElementById('oppConf').value);
    const outcome = document.querySelector('input[name="outcome"]:checked').value;
    let margin = parseInt(document.getElementById('margin').value) || 1;
    if (margin < 1) margin = 1;

    // UI Adjustments based on Draw status
    if (outcome === 'draw') {
        document.getElementById('margin').disabled = true;
        document.getElementById('marginLabel').style.opacity = '0.5';
    } else {
        document.getElementById('margin').disabled = false;
        document.getElementById('marginLabel').style.opacity = '1';
    }

    let matchValue = 0;
    let weight = 1.0;
    let explanation = "";
    let mathString = "";

    // Determine Tier Context
    const isSameTier = (myLevel === oppLevel);
    const levelDiff = oppLevel - myLevel; // Positive means playing UP, Negative means playing DOWN

    // 1. FILTER CALCULATION (Match Weight)
    if (isSameTier) {
        weight = 1.0;
        document.getElementById('outWeightDesc').innerText = "Intraconference match. This game counts for full weight (1.00) in your season standings.";
    } else {
        // Cross-tier weights degrade progressively based on distance
        const distance = Math.abs(levelDiff);
        if (distance === 1) weight = 0.50;
        else if (distance === 2) weight = 0.25;
        else weight = 0.10;
        
        // Exceptional Rule: Penalties never dampen!
        if (outcome === 'loss' && levelDiff < 0) {
            weight = 1.0;
            document.getElementById('outWeightDesc').innerText = "Cross-tier Loss to a LOWER conference. Warning: Deficit penalties never dampen! Weight locked at 1.00.";
        } else {
            document.getElementById('outWeightDesc').innerText = `Cross-tier match (${distance} level split). Weight is filtered down to ${weight.toFixed(2)} to protect standings from out-of-conference noise.`;
        }
    }

    // 2. FLOOR CALCULATION (Match Value)
    if (outcome === 'win') {
        let upsetBonus = levelDiff > 0 ? levelDiff : 0;
        let movBonus = 0;

        // Calculate MOV Bonus
        if (isSameTier) {
            if (margin === 2) movBonus = 0.5;
            else if (margin === 3) movBonus = 1.0;
            else if (margin >= 4) movBonus = 1.5;
        } else {
            if (margin >= 2 && margin <= 3) movBonus = 0.25;
            else if (margin >= 4 && margin <= 5) movBonus = 0.5;
            else if (margin >= 6) movBonus = 0.75;
        }

        matchValue = oppLevel + upsetBonus + movBonus;
        
        explanation = `Win Value: Base opponent level (${oppLevel})`;
        if (upsetBonus > 0) explanation += ` + Upset Credit (+${upsetBonus})`;
        if (movBonus > 0) explanation += ` + Margin Bonus (+${movBonus} for +${margin} GD)`;
        explanation += ".";

        mathString = `${oppLevel} (OppLevel)`;
        if (upsetBonus > 0) mathString += ` + ${upsetBonus} (Upset)`;
        if (movBonus > 0) mathString += ` + ${movBonus} (MOV)`;

    } else if (outcome === 'draw') {
        let upsetBonus = levelDiff > 0 ? levelDiff : 0;
        
        // Draw formula: (OpponentLevel + UpsetBonus/2) * 0.75
        matchValue = (oppLevel + (upsetBonus / 2)) * 0.75;
        
        explanation = `Draw Value: Computed as 75% of your opponent's structural tier value.`;
        if (upsetBonus > 0) explanation += ` Includes partial credit for drawing UP against a higher conference.`;
        
        mathString = `(${oppLevel} + ${upsetBonus / 2}) * 0.75`;

    } else if (outcome === 'loss') {
        if (levelDiff >= 0) {
            // Loss to peer or higher tier
            matchValue = 0;
            explanation = "Loss Value: A loss to an equal or higher conference tier drops your single-game calculation score cleanly to 0.00.";
            mathString = "0.00";
        } else {
            // Loss to lower tier (Downset)
            let downsetPenalty = Math.abs(levelDiff);
            let movPenalty = 0;

            if (margin >= 2 && margin <= 3) movPenalty = 0.5;
            else if (margin >= 4 && margin <= 5) movPenalty = 1.0;
            else if (margin >= 6) movPenalty = 1.5;

            matchValue = 0 - (downsetPenalty + movPenalty);
            
            explanation = `Loss Penalty: Losing down costs a base Downset Penalty (-${downsetPenalty})`;
            if (movPenalty > 0) explanation += ` plus a Margin Penalty (-${movPenalty} for dropping ${margin} goals)`;
            explanation += ".";

            mathString = `0 - (${downsetPenalty} [Downset] + ${movPenalty} [MOV Penalty])`;
        }
    }

    // Update Output Display
    document.getElementById('outValue').innerText = matchValue.toFixed(2);
    document.getElementById('outWeight').innerText = weight.toFixed(2);
    document.getElementById('outValueDesc').innerText = explanation;
    document.getElementById('outMathText').innerText = "Formula: " + mathString;
}

// Initial Run on Load
window.onload = calculatePR;
</script>

</body>
</html>
